name: Release

# Builds the Linux and Windows downloads for a v* tag and publishes them as a GitHub release, with
# notes from docs/releases/<tag>.md (required) and SHA-256 sums. Bump VersionPrefix in
# Directory.Build.props before tagging: the tag must match it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag, version and notes agree
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(grep -m1 '<VersionPrefix>' Directory.Build.props | sed -E 's#.*<VersionPrefix>(.*)</VersionPrefix>.*#\1#')"
          [[ "$tag" == "v$version" ]] || { echo "Tag $tag does not match VersionPrefix $version." >&2; exit 1; }
          [[ -f "docs/releases/$tag.md" ]] || { echo "docs/releases/$tag.md is missing." >&2; exit 1; }

  linux:
    needs: check
    # The oldest supported runner, so the bundled native libraries (Phonon's above all, which is
    # built here) need no newer glibc than Ubuntu 22.04's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev zsync
      - name: Test
        run: dotnet test RailNarrator.slnx -c Release
      - name: Package
        env:
          WITH_PHONON: "yes"
          COMPRESS: "gz"
        run: |
          packaging/build-release.sh
          packaging/build-appimage.sh
      - name: glibc floor
        run: packaging/check-glibc.sh dist/rail-narrator-*-linux-x64/usr/lib/rail-narrator 2.35
      - name: AppImage smoke
        run: |
          test -s dist/rail-narrator-x86_64.AppImage.zsync
          chmod +x dist/rail-narrator-x86_64.AppImage
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 dist/rail-narrator-x86_64.AppImage narrate > usage.txt 2>&1
          code=$?
          set -e
          cat usage.txt
          [[ $code == 2 ]] && grep -q "rail-narrator narrate" usage.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.zsync

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test RailNarrator.slnx -c Release
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package
        shell: bash
        env:
          WITH_PORTAUDIO: "yes"
          WITH_PHONON: "yes"
          WITH_INSTALLER: "yes"
        run: packaging/build-windows.sh
      - name: Native libraries present
        shell: bash
        run: |
          dir=$(echo dist/rail-narrator-*-win-x64)
          ls -l "$dir/portaudio.dll" "$dir/ptts_ffi.dll" "$dir/install-phonon.sh" "$dir/LICENSE"
          grep -q ptts_speak_aligned "$dir/ptts_ffi.dll"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rail Narrator ${GITHUB_REF_NAME#v}" \
            --notes-file "../docs/releases/$GITHUB_REF_NAME.md"
